name: test/calculator
version: "2.0.0"
description: A calculator tool that performs basic math operations
from: python:3.12-alpine

scripts:
  calculate:
    command: "python3 calc.py"
    inputSchema:
      type: object
      properties:
        operation:
          type: string
          enum:
            - add
            - subtract
            - multiply
            - divide
          description: The math operation to perform
        a:
          type: number
          description: First operand
        b:
          type: number
          description: Second operand
      required:
        - operation
        - a
        - b

outputSchema:
  type: object
  properties:
    result:
      type: number
    operation:
      type: string
