name: demo/word-counter
version: "1.0.0"
description: Count words and characters in text, output JSON stats
from: python:3.12-slim

scripts:
  count:
    command: "python3 /workspace/count.py"
    inputSchema:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Text to analyze
    outputSchema:
      type: object
      properties:
        word_count:
          type: integer
        char_count:
          type: integer
        words:
          type: array
