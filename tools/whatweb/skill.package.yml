name: enact/whatweb
version: "1.0.3"
description: Web scanner that identifies websites, CMS, frameworks, web servers, and embedded devices
from: ruby:3.2-alpine

scripts:
  build: "apk add --no-cache git && git clone https://github.com/urbanadventurer/WhatWeb.git /opt/whatweb && gem install addressable"
  scan: "/opt/whatweb/whatweb --colour=never --log-json=/dev/stdout -q -a -t"
  retrieve: "echo 'No retrieval command defined for this package'"
